name: Model Language Interpreter Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ubuntu-build-release:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build_release -DCMAKE_BUILD_TYPE=Release
        
      - name: Build
        run: cmake --build build_release --config Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: build_release/
  
  create-release:
  
    needs: ubuntu-build-release
    
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts
            
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**